<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="robots" content="noindex"><title>6FPS / Editor</title><link rel="stylesheet" href="./admin.css?v=0.5.0"></head>
<body><header><a class="wordmark" href="./">6FPS</a><span class="editor-label">EDITOR</span><nav><form action="./" method="get"><button type="submit">Open studio ↗</button></form><button id="refresh" hidden>Refresh</button><button id="logout" hidden>Sign out</button></nav></header>
<main>
<section id="login-panel" class="login-panel"><h1>Movie editor.</h1><form id="login-form"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button id="login" class="solid" type="submit">Sign in →</button></form><p class="quiet">Admin access only.</p></section>
<section id="editor" hidden>
<div class="project-controls"><select id="admin-project" aria-label="Choose movie"></select><form id="create-project-form"><input id="project-name" aria-label="New movie name" placeholder="New movie name" maxlength="60" required><button type="submit">+ Movie</button></form><button id="clear-movie">Clear movie</button></div><div class="editor-top"><h1>The movie<span id="stats"></span></h1><div class="booking"><span id="booking-state"></span><button id="release-booking" hidden>Release bookings</button></div></div>
<div class="editor-layout"><section class="preview-panel" aria-label="Frame preview"><div class="preview"><img id="preview-image" alt="Selected frame" hidden><span id="empty-preview">No frames</span></div><div class="transport"><span id="preview-number">000</span><button id="admin-play" class="play-button" aria-label="Play movie" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14l11-7z"/></svg></button><span>6 FPS</span></div><input id="admin-scrub" type="range" min="1" max="1" value="1" aria-label="Scrub movie" disabled></section>
<section class="frames-panel" aria-label="Movie frames"><div class="tabs" role="tablist"><button role="tab" id="movie-tab" aria-selected="true">Movie <span id="active-count">0</span></button><button role="tab" id="archive-tab" aria-selected="false">Archive <span id="archive-count">0</span></button></div><div id="frame-grid" class="frame-grid"></div><div id="selection-tools" class="selection-tools" hidden><span id="selection-label"></span><form id="move-form"><label for="move-position">Position</label><input id="move-position" type="number" min="1" required><button id="move" type="submit">Move</button></form><button id="archive">Archive frame</button><button id="restore" hidden>Restore frame</button><button id="delete" hidden>Delete permanently</button></div></section></div>
</section>
<p id="message" role="status" aria-live="polite"></p>
</main><script type="module" src="./admin.js?v=0.5.0"></script></body></html>
