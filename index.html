<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="sixfps-release" content="0.5.2"><title>6FPS</title><link rel="stylesheet" href="./style.css?v=0.5.2"></head>
<body>
<main class="app">

<header><a href="./" class="wordmark" aria-label="6FPS home">6FPS</a><select id="project-select" aria-label="Choose movie"><option>Loading…</option></select><div class="toolbar top-tools" role="toolbar" aria-label="Drawing tools"><button class="tool active" data-tool="round" aria-label="Round brush" title="Round brush" aria-pressed="true"><span class="brush-icon round-icon" aria-hidden="true"></span></button><button class="tool" data-tool="square" aria-label="Square brush" title="Square brush" aria-pressed="false"><span class="brush-icon square-icon" aria-hidden="true"></span></button><button class="tool" data-tool="eraser" aria-label="Eraser" title="Eraser" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 13 9-9 7 7-9 9H7l-3-3v-4Zm4-4 7 7M11 20h10"/></svg></button><input id="size" class="brush-size-slider" type="range" min="1" max="96" value="12" aria-label="Brush size"><label class="brush-colour" for="colour">Colour<input id="colour" type="color" value="#000000" aria-label="Brush colour"></label></div><div class="booking-actions"><span id="booking-status" role="status"></span><button id="release" hidden>Leave</button><button id="publish" class="solid" hidden>Publish ↑</button></div></header>
<section class="workspace" aria-label="Drawing studio">
<div class="stage"><div class="canvas-stack"><canvas id="onion" width="1080" height="1920" aria-hidden="true"></canvas><canvas id="drawing" width="1080" height="1920" aria-label="Drawing canvas"></canvas></div></div>
<div class="canvas-controls"><div class="frame-info"><span id="canvas-title" class="frame-label">000</span><span id="frame-credit" hidden></span><button id="edit-name" type="button" hidden>Your name</button></div><label class="overlay" title="Previous frame overlay"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="11" height="14" rx="1"/><path d="M9 7h11v14H9z"/></svg><input id="opacity" type="range" min="0" max="80" value="25" aria-label="Previous frame opacity"><output id="opacity-value">25%</output></label><div class="history"><button id="undo" aria-label="Undo" title="Undo">↶</button><button id="redo" aria-label="Redo" title="Redo">↷</button></div></div>
</section>
<section class="timeline-panel" aria-label="Movie timeline"><div class="timeline-top"><button id="book" class="solid" aria-label="Book next available frame" disabled>+</button><span id="progress">0/90 · 0/15s</span><span id="live-status">CONNECTING</span></div><div id="filmstrip" class="filmstrip" aria-label="Frames — drag to scrub"></div><input id="scrubber" type="range" min="1" max="1" value="1" disabled aria-label="Scrub movie"><div class="transport"><span id="position">000 / 000</span><button id="play" aria-label="Play movie" title="Play movie" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14l11-7z"/></svg></button><div class="export-controls"><span class="playback-rate" aria-label="Playback fixed at 6 frames per second">6 FPS</span><button id="export-video" type="button" hidden>Export video ↓</button></div></div></section>
</main><dialog id="name-dialog" aria-labelledby="name-label"><form id="name-form"><label id="name-label" for="artist-name">Your name</label><small id="name-optional">Optional</small><input id="artist-name" type="text" maxlength="40" autocomplete="nickname" aria-describedby="name-optional"><div class="name-actions"><button id="name-cancel" type="button">Cancel</button><button class="solid" type="submit">Continue</button></div></form></dialog><dialog id="export-dialog" aria-labelledby="export-title"><h2 id="export-title">Export video</h2><p id="export-status" role="status">Preparing…</p><progress id="export-progress" max="90" value="0" aria-label="Video export progress"></progress><div class="export-actions"><a id="export-download" hidden download>Download video</a><button id="export-close" type="button">Cancel</button></div></dialog><div id="toast" role="status" aria-live="polite"></div><script type="module" src="./app.js?v=0.5.2"></script>
</body></html>
