<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>6FPS</title><link rel="stylesheet" href="./style.css"></head>
<body>
<main class="app">
<header><a href="./" class="wordmark" aria-label="6FPS home">6FPS</a><div class="booking-actions"><span id="booking-status" role="status"></span><button id="release" hidden>Leave</button><button id="book" class="solid">+ Frame</button><button id="publish" class="solid" hidden>Publish ↑</button></div></header>
<section class="workspace" aria-label="Drawing studio">
<div class="toolbar" role="toolbar" aria-label="Drawing tools"><button class="tool active" data-tool="pen" aria-pressed="true" aria-expanded="false" aria-controls="pen-settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 15 10-10 4 4L9 19l-5 1 1-5Zm8-8 4 4"/></svg>Pen<span class="chevron">⌄</span></button><button class="tool" data-tool="eraser" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 13 9-9 7 7-9 9H7l-3-3v-4Zm4-4 7 7M11 20h10"/></svg>Eraser</button></div>
<div id="pen-settings" class="settings" hidden><div class="setting-row"><span>Shape</span><div class="shape-options" role="group" aria-label="Pen shape"><button data-shape="round" aria-label="Round pen" aria-pressed="true" class="chosen">●</button><button data-shape="square" aria-label="Square pen" aria-pressed="false">■</button></div></div><label class="setting-row" for="size">Size <input id="size" type="range" min="1" max="48" value="6"><output id="size-value">6</output></label><label class="setting-row" for="wetness">Wetness <input id="wetness" type="range" min="0" max="100" value="80"><output id="wetness-value">80</output></label></div>
<div class="stage"><div class="canvas-stack"><canvas id="onion" width="540" height="960" aria-hidden="true"></canvas><canvas id="drawing" width="540" height="960" aria-label="Drawing canvas"></canvas></div></div>
<div class="canvas-controls"><span id="canvas-title" class="frame-label">000</span><label class="overlay" title="Previous frame overlay"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="11" height="14" rx="1"/><path d="M9 7h11v14H9z"/></svg><input id="opacity" type="range" min="0" max="80" value="25" aria-label="Previous frame opacity"><output id="opacity-value">25%</output></label><div class="history"><button id="undo" aria-label="Undo" title="Undo">↶</button><button id="redo" aria-label="Redo" title="Redo">↷</button></div></div>
</section>
<section class="timeline-panel" aria-label="Movie timeline"><div id="filmstrip" class="filmstrip" aria-label="Frames — drag to scrub"></div><input id="scrubber" type="range" min="1" max="1" value="1" disabled aria-label="Scrub movie"><div class="transport"><span id="position">000 / 000</span><button id="play" aria-label="Play movie" title="Play movie" disabled>▶</button><span class="playback-rate" aria-label="Playback fixed at 6 frames per second">6 FPS</span></div></section>
</main><div id="toast" role="status" aria-live="polite"></div><script type="module" src="./app.js"></script>
</body></html>
